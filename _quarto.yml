project:
  type: website
  output-dir: docs

website:
  title: "Macbeth & Sarah"
  page-navigation: false
  search: false
  navbar:
    pinned: true
    left:
      - text: "Home"
        href: "#hero"
      - text: "Our Story"
        href: "#story"
      - text: "Details"
        href: "#details"
      - text: "Gallery"
        href: "#gallery"
      - text: "Registry"
        href: "#registry"

format:
  html:
    theme: flatly
    css: styles.css
    include-in-header: 
      - text: |
          <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    include-after-body:
      - text: |
          <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
          <script>
            AOS.init({
              duration: 600,
              once: false
            });
          </script>