project:
  type: website
  output-dir: docs

website:
  title: "Macbeth & Sarah"
  page-navigation: false
  search: false
  navbar:
    pinned: true
    left:
      - text: "Home"
        href: "#hero"
      - text: "Our Story"
        href: "#story"
      - text: "Details"
        href: "#details"
      - text: "Gallery"
        href: "#gallery"
      - text: "Registry"
        href: "#registry"

format:
  html:
    theme: flatly
    css: styles.css

    include-in-header:
      - text: |
          <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    include-after-body:
      - text: |
          <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
          <script>
            AOS.init({
              duration: 600,
              once: true,
              startEvent: 'load'
            });
          </script>

          <script>
            document.addEventListener("DOMContentLoaded", function () {

              /* =========================
                 STORY SLIDER
              ========================== */
              const slides = document.querySelectorAll(".story-slide");
              const nextBtn = document.querySelector(".story-next");
              const prevBtn = document.querySelector(".story-prev");

              if (slides.length && nextBtn && prevBtn) {

                let current = 0;

                function showSlide(index) {
                  slides.forEach(slide => slide.classList.remove("active"));
                  slides[index].classList.add("active");
                }

                nextBtn.addEventListener("click", function () {
                  if (current < slides.length - 1) {
                    current++;
                  }
                  showSlide(current);
                });

                prevBtn.addEventListener("click", function () {
                  if (current > 0) {
                    current--;
                  }
                  showSlide(current);
                });
              }

              /* =========================
                 GALLERY SLIDER (AUTO + DOTS + PAUSE)
              ========================== */
              const gSlides = document.querySelectorAll(".gallery-slide");
              const gNext = document.querySelector(".gallery-next");
              const gPrev = document.querySelector(".gallery-prev");
              const dotsContainer = document.querySelector(".gallery-dots");
              const galleryWrapper = document.querySelector(".gallery-slider");

              if (gSlides.length && gNext && gPrev && dotsContainer) {

                let gCurrent = 0;
                let autoPlayInterval;

                /* ----- Create dots dynamically ----- */
                gSlides.forEach((_, index) => {
                  const dot = document.createElement("span");
                  dot.classList.add("gallery-dot");

                  dot.addEventListener("click", function () {
                    gCurrent = index;
                    updateGallery(gCurrent);
                    resetAutoPlay();
                  });

                  dotsContainer.appendChild(dot);
                });

                function updateGallery(index) {
                  gSlides.forEach(slide => slide.classList.remove("active"));

                  const gDots = document.querySelectorAll(".gallery-dot");
                  gDots.forEach(dot => dot.classList.remove("active"));

                  gSlides[index].classList.add("active");
                  if (gDots[index]) {
                    gDots[index].classList.add("active");
                  }
                }

                function startAutoPlay() {
                  autoPlayInterval = setInterval(function () {
                    if (gCurrent < gSlides.length - 1) {
                      gCurrent++;
                    } else {
                      gCurrent = 0; // loop back
                    }
                    updateGallery(gCurrent);
                  }, 3500);
                }

                function resetAutoPlay() {
                  clearInterval(autoPlayInterval);
                  startAutoPlay();
                }

                /* ----- Button Controls ----- */
                gNext.addEventListener("click", function () {
                  if (gCurrent < gSlides.length - 1) {
                    gCurrent++;
                  } else {
                    gCurrent = 0;
                  }
                  updateGallery(gCurrent);
                  resetAutoPlay();
                });

                gPrev.addEventListener("click", function () {
                  if (gCurrent > 0) {
                    gCurrent--;
                  } else {
                    gCurrent = gSlides.length - 1;
                  }
                  updateGallery(gCurrent);
                  resetAutoPlay();
                });

                /* ----- Pause on Hover (Premium UX) ----- */
                galleryWrapper.addEventListener("mouseenter", function () {
                  clearInterval(autoPlayInterval);
                });

                galleryWrapper.addEventListener("mouseleave", function () {
                  startAutoPlay();
                });

                updateGallery(gCurrent);
                startAutoPlay();
              }

              /* =========================
                 NAVBAR COLOR ON SCROLL
              ========================== */
              const sections = document.querySelectorAll("section");
              const navbar = document.querySelector(".navbar");

              function updateNavbarColor() {
                let scrollPosition = window.scrollY + 120;

                sections.forEach(section => {
                  if (
                    scrollPosition >= section.offsetTop &&
                    scrollPosition < section.offsetTop + section.offsetHeight
                  ) {
                    const color = section.getAttribute("data-navcolor");
                    if (color && navbar) {
                      navbar.style.backgroundColor = color;
                    }
                  }
                });
              }

              window.addEventListener("scroll", updateNavbarColor);

            });
          </script>